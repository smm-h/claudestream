# strictspec adjudication file -- claudestream AgentDefinition, format_version 1.
#
# Shape pinned in strictspec spec/appendix-certificates.md Part B (validated by the
# toolchain-shipped built-in Adjudication schema; STRICTSPEC_DIFF_ADJUDICATION_*
# police its validity).
#
# WHY THIS FILE EXISTS: claudestream has ZERO at-rest .agent.json corpus at adoption
# time (the schema is greenfield; agents are authored fresh). `strictspec diff`
# requires a non-empty --corpus (STRICTSPEC_DIFF_CORPUS_EMPTY) and the format_version
# deploy gate's green light is `corpus-supported` OVER the consumer's declared at-rest
# corpus -- which here is empty. Per DESIGN.md decision 25 and appendix-certificates.md
# Part A.5, a consumer with no corpus cannot reach `corpus-supported` and must discharge
# each otherwise-unsupported claim via this committed adjudication file. There is no
# bypass. This file is superseded automatically once claudestream accumulates a real
# at-rest corpus and a diff certificate can speak `corpus-supported` for it.

format_version = 1
schema_id = "AgentDefinition"
old_format_version = 1
new_format_version = 1

[[adjudications]]
claim_kind = "flip-scan"
scope = "same-version flip-scan: no AgentDefinition document flips valid at format_version 1 (empty declared at-rest corpus)"
justification = "Initial ship of AgentDefinition at format_version 1 with zero at-rest .agent.json corpus. The flip-scan claim has no corpus document to witness support, so it cannot reach corpus-supported. It is discharged manually: the format_version 1 schema is the birth version, authored greenfield from the msgspec struct field set, and no pre-existing documents exist to be narrowed. This adjudication is retired the moment a real corpus exists and `strictspec diff` can emit a corpus-supported certificate."
author = "claudestream-maintainers"
date = 2026-07-27
