[project]
name = "claudestream"
version = "0.14.2"
description = "A Python library and CLI for streaming Claude Code's JSON protocol"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "SMM-H", email = "lisa.codi@veliu.com"}]
dependencies = [
    # Floor, not a pin: 0.41.0 made the per-flag presence declaration mandatory
    # (exactly one of presence="required" / presence="optional" / default=) and
    # banned value defaults on mutating commands. Every declaration in
    # claudestream/_cli.py is written in that spelling, and an older strictcli
    # rejects `presence=` outright, so it cannot register them at all.
    "strictcli>=0.41.0",
    "msgspec",
    # selfdoc is not imported anywhere in this package. It is the docs
    # generator, invoked as a binary by .rlsbl/hooks/post-release.sh, and it
    # constrains resolution here for no runtime reason (its current release
    # requires Python >=3.12 while this package supports >=3.11, which is why
    # the lock carries a marker split). It stays declared and unfloored until
    # its place in this manifest is decided.
    "selfdoc",
    # Unfloored deliberately. claudestream imports exactly one thing from
    # claudewheel -- claudewheel.profile.resolve_profile -- and that module
    # does not touch strictcli, so it works under the 0.41.0 floor above at
    # every published claudewheel. claudewheel's *CLI* does not: every release
    # up to and including 0.26.0 imports a strictcli name that 0.41.0 removed,
    # and the repair ships in claudewheel's own next release. A floor at a
    # version that does not exist yet would only make this package
    # unresolvable, so the floor waits for that release.
    "claudewheel",
    "strictspec>=0.1.0",
]
keywords = ["rlsbl"]

[project.scripts]
claudestream = "claudestream._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a real claude CLI and authentication (opt in with CLAUDESTREAM_INTEGRATION=1)",
    "slow: tests that take >10s (e.g. subprocess liveness probes)",
]

# The stricttest isolation floor. Installing the plugin IS adoption of the
# floor, and no key has an implicit default -- a missing one aborts the session
# at configure time -- so all five stances are declared explicitly.
#
# Every stance here is deny. The suite talks to subprocesses over pipes, never
# over sockets: the replay lane drives tests/fixtures/claude_vcr.py through
# stdin/stdout, and the live lane (which does reach the network, through the
# claude binary) is a separate opt-in process that is skipped here.
stricttest_sockets = "deny"
stricttest_socket_allowlist = []
stricttest_unix_socket_allowlist = []
stricttest_loopback = "deny"
# No sandbox runner in this repo yet; the bwrap runner ships as an rlsbl
# scaffold template. Flip to "true" at adoption.
stricttest_sandbox_required = "false"

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout>=2.4.0",
    "stricttest>=0.2.0",
]
