# strictspec manifest (strictspec.toml).
# Generation is file-driven: declare each schema and its targets, then run
#   strictspec gen --manifest strictspec.toml
format_version = 1

[[schemas]]
path = ".strictspec/agent-definition.schema.toml"

  [[schemas.targets]]
  lang    = "python"
  output  = "claudestream/_agent_schema.py"
  package = "claudestream"
